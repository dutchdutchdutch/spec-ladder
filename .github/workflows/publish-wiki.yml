# Publishes the wiki/ folder to this repo's GitHub wiki.
# The wiki/ folder is the single source of truth: every push to main
# that touches wiki/ overwrites the wiki to match it exactly.
# Page titles come from file names (Home.md is the wiki landing page).
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ["wiki/**"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync wiki/ folder to the wiki repository
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          rsync -av --delete --exclude=.git wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Wiki already up to date."; exit 0; }
          git commit -m "Sync wiki from ${GITHUB_SHA}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
